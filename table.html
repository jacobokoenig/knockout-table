<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Knockout Bracket</title>
<style>
  :root{
    --bg:#0a0a0c; --line:#2b2b33; --dot:#3a3a44;
    --txt:#ECECEE; --muted:#7d7d88; --gold:#f4c64a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .topbar{position:fixed;top:18px;left:20px;z-index:30;display:flex;gap:10px;align-items:center;}
  button{background:#ededed;color:#111;border:none;border-radius:10px;
    padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;
    transition:transform .08s ease,background .15s ease;}
  button.ghost{background:#1d1d22;color:#d8d8de;border:1px solid #2e2e36;}
  button:hover{transform:translateY(-1px);}
  .handle{position:fixed;top:60px;left:22px;z-index:30;color:var(--muted);font-size:14px;}
  .stage{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;}
  svg{width:min(94vmin,940px);height:min(94vmin,940px);display:block;}
  .conn{fill:none;stroke:var(--line);stroke-width:1.4;}
  .node-hit{cursor:pointer;}
  .node-hit.disabled{cursor:default;}
  .flag-bg{fill:#15151a;}
  .flag-border{fill:none;stroke:#000;stroke-opacity:.4;stroke-width:1.5;}
  .ring-clickable{fill:none;stroke:#fff;stroke-opacity:0;stroke-width:2.5;transition:stroke-opacity .15s;}
  .node-hit:not(.disabled):hover .ring-clickable{stroke-opacity:.9;}
  .empty-dot{fill:var(--dot);}
  .guide{fill:none;stroke:#fff;stroke-opacity:.035;stroke-width:1;}
  .emoji{paint-order:stroke;}
  #tooltip{position:fixed;pointer-events:none;z-index:40;background:#000;border:1px solid #33333d;
    color:#fff;padding:7px 11px;border-radius:9px;font-size:13px;opacity:0;transform:translate(-50%,-130%);
    transition:opacity .1s;white-space:nowrap;box-shadow:0 6px 22px rgba(0,0,0,.5);}
  #tooltip .r{color:var(--muted);font-size:11px;display:block;margin-top:1px;}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#fff;color:#111;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;
    opacity:0;transition:all .25s;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .title{position:fixed;top:18px;right:24px;text-align:right;z-index:30;}
  .title h1{margin:0;font-size:15px;letter-spacing:.5px;font-weight:700;}
  .title p{margin:2px 0 0;font-size:12px;color:var(--muted);}
  @media (max-width:640px){
    .topbar{top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));}
    .title{
      top:52px;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));
      text-align:center;
    }
    .title h1{font-size:13px;}
    .title p{font-size:11px;}
    .handle{
      top:78px;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));
      text-align:center;font-size:11px;
    }
    .stage{padding-top:100px;min-height:calc(100vh - 100px);}
  }
  @media (hover:none),(pointer:coarse){
    .ring-clickable{display:none;}
  }
</style>
</head>
<body>
  <div class="topbar">
    <button id="shareBtn">Share</button>
    <button id="resetBtn" class="ghost">Reset</button>
  </div>
  <div class="handle">FIFA World Cup 2026™ · Knockouts</div>
  <div class="title">
    <h1>ROAD TO VICTORY</h1>
    <p>Tap a flag to send a team through</p>
  </div>

  <div class="stage">
    <svg id="bracket" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div id="tooltip"></div>
  <div class="toast" id="toast"></div>

<script>
/* ---- Accurate 2026 World Cup Round of 32, in radial bracket order ----
   Verified vs FIFA bracket structure (matches 73–104) + confirmed group results.
   Each consecutive pair = one R32 match; adjacent pairs nest into R16, QF, SF, Final. */
const LEAVES = [
  {n:"Germany",e:"🇩🇪"},      {n:"Paraguay",e:"🇵🇾"},
  {n:"France",e:"🇫🇷"},       {n:"Sweden",e:"🇸🇪"},
  {n:"South Africa",e:"🇿🇦"}, {n:"Canada",e:"🇨🇦"},
  {n:"Netherlands",e:"🇳🇱"},  {n:"Morocco",e:"🇲🇦"},
  {n:"Portugal",e:"🇵🇹"},     {n:"Croatia",e:"🇭🇷"},
  {n:"Spain",e:"🇪🇸"},        {n:"Austria",e:"🇦🇹"},
  {n:"United States",e:"🇺🇸"},{n:"Bosnia & Herz.",e:"🇧🇦"},
  {n:"Belgium",e:"🇧🇪"},      {n:"Senegal",e:"🇸🇳"},
  {n:"Brazil",e:"🇧🇷"},       {n:"Japan",e:"🇯🇵"},
  {n:"Ivory Coast",e:"🇨🇮"},  {n:"Norway",e:"🇳🇴"},
  {n:"Mexico",e:"🇲🇽"},       {n:"Ecuador",e:"🇪🇨"},
  {n:"England",e:"🏴󠁧󠁢󠁥󠁮󠁧󠁿"},      {n:"DR Congo",e:"🇨🇩"},
  {n:"Argentina",e:"🇦🇷"},    {n:"Cape Verde",e:"🇨🇻"},
  {n:"Australia",e:"🇦🇺"},    {n:"Egypt",e:"🇪🇬"},
  {n:"Switzerland",e:"🇨🇭"},  {n:"Algeria",e:"🇩🇿"},
  {n:"Colombia",e:"🇨🇴"},     {n:"Ghana",e:"🇬🇭"}
];

const ROUND=["Round of 32","Round of 16","Quarter-final","Semi-final","Final","Champion"];
/* FIFA kickoffs (UTC ISO) by bracket node (lvl, idx). R32 from confirmed fixtures (matches 73–88). */
const MATCH_KICKOFFS={
  1:["2026-06-29T20:30:00Z","2026-06-30T21:00:00Z","2026-06-28T19:00:00Z","2026-06-30T01:00:00Z",
     "2026-07-02T23:00:00Z","2026-07-02T19:00:00Z","2026-07-02T00:00:00Z","2026-07-01T20:00:00Z",
     "2026-06-29T17:00:00Z","2026-06-30T17:00:00Z","2026-07-01T01:00:00Z","2026-07-01T16:00:00Z",
     "2026-07-03T22:00:00Z","2026-07-03T18:00:00Z","2026-07-03T03:00:00Z","2026-07-04T01:30:00Z"],
  2:["2026-07-04T17:00:00Z","2026-07-04T21:00:00Z","2026-07-06T19:00:00Z","2026-07-07T00:00:00Z",
     "2026-07-05T19:00:00Z","2026-07-06T01:00:00Z","2026-07-07T19:00:00Z","2026-07-08T00:00:00Z"],
  3:["2026-07-09T20:00:00Z","2026-07-10T19:00:00Z","2026-07-11T21:00:00Z","2026-07-12T01:00:00Z"],
  4:["2026-07-14T19:00:00Z","2026-07-15T19:00:00Z"],
  5:["2026-07-19T19:00:00Z"]
};
const localDateFmt=new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric",year:"numeric"});
function formatLocalDate(iso){
  if(!iso)return"";
  const d=new Date(iso);
  return Number.isNaN(d.getTime())?"":localDateFmt.format(d);
}
const R  =[438,345,256,176,104,0];                 // grid (positions) unchanged
const SZ =[24,24,24,24,24,38].map(v=>v*1.15);       // constant flag size every round (+15%)
const CX=500,CY=500;
const SVGNS="http://www.w3.org/2000/svg";

// build tree
const levels=[[],[],[],[],[],[]];
LEAVES.forEach((t,i)=>levels[0].push({lvl:0,idx:i,team:t,children:null,winnerChild:null,parent:null}));
for(let l=1;l<=5;l++){const cnt=32>>l;for(let i=0;i<cnt;i++){
  const c1=levels[l-1][2*i],c2=levels[l-1][2*i+1];
  const node={lvl:l,idx:i,team:null,children:[c1,c2],winnerChild:null,parent:null};
  c1.parent=node;c2.parent=node;levels[l].push(node);}}
const N=32;
const OFFSET=Math.PI/N; // half a slot: makes the finalists axis perfectly horizontal
levels[0].forEach((n,i)=>n.angle=(i/N)*2*Math.PI-Math.PI/2+OFFSET);
for(let l=1;l<=5;l++)levels[l].forEach(n=>n.angle=(n.children[0].angle+n.children[1].angle)/2);
const ALL=[];levels.forEach(L=>L.forEach(n=>{n.id=n.lvl+"-"+n.idx;ALL.push(n);}));
const byId=Object.fromEntries(ALL.map(n=>[n.id,n]));
const champ=levels[5][0];
const polar=(r,a)=>[CX+r*Math.cos(a),CY+r*Math.sin(a)];

function recompute(){
  for(let l=1;l<=5;l++)levels[l].forEach(n=>{
    if(n.winnerChild&&n.winnerChild.team)n.team=n.winnerChild.team;
    else{n.winnerChild=null;n.team=null;}});
}

// share state <-> hash + localStorage
const STORAGE_KEY="wc2026-knockout-bracket";
const pickNodes=[];for(let l=1;l<=5;l++)levels[l].forEach(n=>pickNodes.push(n));
const encode=()=>pickNodes.map(n=>n.winnerChild?(n.winnerChild===n.children[0]?"0":"1"):"-").join("");
const syncHash=()=>{try{history.replaceState(null,"","#"+encode());}catch(e){}};
const saveState=()=>{const s=encode();try{localStorage.setItem(STORAGE_KEY,s);}catch(e){}syncHash();};
const clearState=()=>{try{localStorage.removeItem(STORAGE_KEY);}catch(e){}};
function decode(s){if(!s)return;pickNodes.forEach((n,i)=>{const c=s[i];
  if(c==="0")n.winnerChild=n.children[0];else if(c==="1")n.winnerChild=n.children[1];});recompute();}
function loadState(){
  const hash=location.hash.replace(/^#/,"");
  if(hash){decode(hash);try{localStorage.setItem(STORAGE_KEY,encode());}catch(e){}return;}
  try{const stored=localStorage.getItem(STORAGE_KEY);if(stored)decode(stored);}catch(e){}
}

// static connectors + guides
let CONN="";
for(let l=1;l<=5;l++){const Rp=R[l],Rc=R[l-1];
  levels[l].forEach(n=>{const a1=n.children[0].angle,a2=n.children[1].angle;
    if(l===5){const c1=polar(Rc,a1),c2=polar(Rc,a2);
      CONN+=`<path class="conn" d="M${c1[0].toFixed(1)} ${c1[1].toFixed(1)} L${CX} ${CY} L${c2[0].toFixed(1)} ${c2[1].toFixed(1)}"/>`;return;}
    const ci1=polar(Rc,a1),ci2=polar(Rc,a2),p1=polar(Rp,a1),p2=polar(Rp,a2);
    CONN+=`<path class="conn" d="M${ci1[0].toFixed(1)} ${ci1[1].toFixed(1)} L${p1[0].toFixed(1)} ${p1[1].toFixed(1)} `+
      `A${Rp} ${Rp} 0 0 1 ${p2[0].toFixed(1)} ${p2[1].toFixed(1)} L${ci2[0].toFixed(1)} ${ci2[1].toFixed(1)}"/>`;});}
let GUIDE="";[R[0],R[1],R[2],R[3],R[4]].forEach(r=>GUIDE+=`<circle class="guide" cx="${CX}" cy="${CY}" r="${r}"/>`);

let showLabels=false, animating=false, hideId=null, tipHideTimer=null;

function matchDate(n){
  const slot=n.lvl===0?n.parent:n;
  if(!slot||slot.lvl<1)return"";
  return formatLocalDate(MATCH_KICKOFFS[slot.lvl]?.[slot.idx]);
}
function tipHtml(n){
  const label=n.team?n.team.n:"To be decided";
  const date=matchDate(n);
  const meta=[ROUND[n.lvl],date].filter(Boolean).join(" · ");
  return`${label}<span class="r">${meta}</span>`;
}

function flagDisc(x,y,r,emoji,id){
  const cid="clip-"+id;
  return `<clipPath id="${cid}"><circle cx="${x}" cy="${y}" r="${r}"/></clipPath>`+
    `<circle class="flag-bg" cx="${x}" cy="${y}" r="${r}"/>`+
    `<text class="emoji" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" `+
      `font-size="${(r*2.05).toFixed(1)}" clip-path="url(#${cid})">${emoji}</text>`+
    `<circle class="flag-border" cx="${x}" cy="${y}" r="${r}"/>`;
}

function flagNode(n){
  const r=SZ[n.lvl];const[x,y]=polar(R[n.lvl],n.angle);
  const clickable=!!n.team&&!!n.parent;
  const hidden=(n.id===hideId);
  let g=`<g class="node-hit ${clickable?"":"disabled"}${!n.team&&n.lvl>0?" dot-slot":""}" data-id="${n.id}">`;
  if(n.team&&!hidden){
    const advanced=n.parent&&n.parent.winnerChild===n;   // already moved to a later round
    g+=`<g opacity="${advanced?0.38:1}">`+flagDisc(x,y,r,n.team.e,n.id)+`</g>`;
    g+=`<circle class="ring-clickable" cx="${x}" cy="${y}" r="${r+3}"/>`;
    if(showLabels)
      g+=`<text x="${x}" y="${y+r+11}" text-anchor="middle" font-size="9" fill="#cfcfd6" `+
         `style="paint-order:stroke;stroke:#000;stroke-width:2.5px;stroke-linejoin:round;">${n.team.n}</text>`;
  }else if(!n.team){
    g+=`<circle class="empty-dot" cx="${x}" cy="${y}" r="3.2"/>`;
  }
  g+=`<circle cx="${x}" cy="${y}" r="${Math.max(r,8)}" fill="transparent"/></g>`;
  return g;
}

function centerPiece(){
  if(champ.team){const r=SZ[5];
    return `<circle cx="${CX}" cy="${CY}" r="${r+9}" fill="none" stroke="var(--gold)" stroke-width="2" opacity=".5"/>`+
      flagDisc(CX,CY,r,champ.team.e,"champ")+
      `<circle cx="${CX}" cy="${CY}" r="${r}" fill="none" stroke="var(--gold)" stroke-width="3"/>`+
      `<text x="${CX}" y="${CY-r-16}" text-anchor="middle" font-size="20">🏆</text>`+
      `<text x="${CX}" y="${CY+r+22}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--gold)" style="letter-spacing:1px;">${champ.team.n.toUpperCase()}</text>`+
      `<text x="${CX}" y="${CY+r+38}" text-anchor="middle" font-size="9" fill="#8a8a93" style="letter-spacing:2px;">CHAMPIONS</text>`;}
  return `<text x="${CX}" y="${CY+14}" text-anchor="middle" font-size="44">🏆</text>`+
    `<text x="${CX}" y="${CY+44}" text-anchor="middle" font-size="10" fill="#7d7d88" style="letter-spacing:3px;">FINAL</text>`;
}

function render(){
  let s=GUIDE+CONN;
  for(let l=0;l<=4;l++)levels[l].forEach(n=>s+=flagNode(n));
  s+=centerPiece();
  document.getElementById("bracket").innerHTML=s;
}

// ---- animate the flag advancing along the bracket, then commit ----
function animateAdvance(n,done){
  const parent=n.parent, a1=n.angle, ap=parent.angle;
  const Rc=R[n.lvl], Rp=R[parent.lvl], [sx,sy]=polar(Rc,a1);
  let d;
  if(parent.lvl===5){ d=`M${sx} ${sy} L${CX} ${CY}`; }
  else{ const pin=polar(Rp,a1), ppar=polar(Rp,ap), sweep=(ap>a1)?1:0;
    d=`M${sx} ${sy} L${pin[0]} ${pin[1]} A${Rp} ${Rp} 0 0 ${sweep} ${ppar[0]} ${ppar[1]}`; }
  const tmp=document.createElementNS(SVGNS,"path");
  tmp.setAttribute("d",d);tmp.setAttribute("fill","none");tmp.style.visibility="hidden";
  svg.appendChild(tmp);
  const len=tmp.getTotalLength();
  const r=SZ[parent.lvl];                            // match the settled node exactly
  const g=document.createElementNS(SVGNS,"g");
  g.innerHTML=`<circle r="${r+4}" fill="var(--bg)"/>`+
    `<circle r="${r}" fill="#15151a"/>`+
    `<text text-anchor="middle" dominant-baseline="central" font-size="${(r*2.05).toFixed(1)}">${n.team.e}</text>`+
    `<circle r="${r}" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="1.5"/>`;
  svg.appendChild(g);
  const dur=640,t0=performance.now(),ease=t=>1-Math.pow(1-t,3);
  (function frame(now){
    let t=(now-t0)/dur;if(t>1)t=1;
    const p=tmp.getPointAtLength(ease(t)*len);
    const sc=0.8+0.2*Math.sin(t*Math.PI);
    g.setAttribute("transform",`translate(${p.x} ${p.y}) scale(${sc.toFixed(3)})`);
    if(t<1)requestAnimationFrame(frame);
    else{tmp.remove();g.remove();done();}
  })(performance.now());
}

function pick(n){
  if(!n.team||!n.parent||animating)return;
  animating=true;                              // source flag stays put; a copy flies inward
  animateAdvance(n,()=>{
    n.parent.winnerChild=n;
    let a=n.parent.parent;while(a){a.winnerChild=null;a=a.parent;}
    recompute();saveState();hideId=null;animating=false;render();
  });
}

// events
const svg=document.getElementById("bracket");
const tip=document.getElementById("tooltip");
const finePointer=window.matchMedia("(hover: hover) and (pointer: fine)").matches;
function showTip(n,x,y){tip.innerHTML=tipHtml(n);tip.style.left=x+"px";tip.style.top=y+"px";tip.style.opacity=1;}
function hideTip(){tip.style.opacity=0;}
svg.addEventListener("click",e=>{const g=e.target.closest(".node-hit");if(!g)return;
  const n=byId[g.dataset.id];
  if(g.classList.contains("dot-slot")&&!finePointer){
    showTip(n,e.clientX,e.clientY);clearTimeout(tipHideTimer);tipHideTimer=setTimeout(hideTip,2500);return;}
  if(g.classList.contains("disabled"))return;pick(n);});
if(finePointer){
  svg.addEventListener("mousemove",e=>{const g=e.target.closest(".dot-slot");
    if(!g){hideTip();return;}showTip(byId[g.dataset.id],e.clientX,e.clientY);});
  svg.addEventListener("mouseleave",hideTip);
}

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600);}
document.getElementById("resetBtn").onclick=()=>{if(animating)return;pickNodes.forEach(n=>{n.winnerChild=null;n.team=null;});recompute();clearState();syncHash();render();};
document.getElementById("shareBtn").onclick=async()=>{saveState();
  try{await navigator.clipboard.writeText(location.href);toast("Link copied to clipboard");}
  catch{toast("Copy this URL from the address bar");}};

loadState();
render();
</script>
</body>
</html>
